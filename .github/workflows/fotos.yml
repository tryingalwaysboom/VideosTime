name: fotos
on:
  push:
    paths: ["descargas/**/fotos.txt"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fotos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q requests pillow
      - name: Buscar fotos libres (Wikimedia Commons)
        run: |
          python - <<'PY'
          import glob, os, io, json, time, requests
          from PIL import Image
          H={"User-Agent":"VideosTimeBot/1.0 (https://github.com/tryingalwaysboom/VideosTime)"}
          API="https://commons.wikimedia.org/w/api.php"
          for marca in glob.glob("descargas/**/fotos.txt", recursive=True):
              out=os.path.dirname(marca)
              for linea in open(marca, encoding="utf-8"):
                  linea=linea.strip()
                  if not linea or "|" not in linea: continue
                  clave, q = [s.strip() for s in linea.split("|",1)]
                  try:
                      r=requests.get(API,params={"action":"query","format":"json","generator":"search","gsrsearch":q+" filetype:bitmap","gsrnamespace":6,"gsrlimit":10,
                          "prop":"imageinfo","iiprop":"url|size|extmetadata","iiurlwidth":1600},headers=H,timeout=30).json()
                  except Exception as e:
                      print("err",q,e); continue
                  pages=sorted(r.get("query",{}).get("pages",{}).values(),key=lambda p:p.get("index",99))
                  meta=[];n=0
                  for p in pages:
                      ii=p.get("imageinfo",[{}])[0]
                      if min(ii.get("width",0),ii.get("height",0))<900: continue
                      lic=ii.get("extmetadata",{}).get("LicenseShortName",{}).get("value","")
                      art=ii.get("extmetadata",{}).get("Artist",{}).get("value","")
                      try:
                          b=requests.get(ii.get("thumburl") or ii["url"],headers=H,timeout=40).content
                          im=Image.open(io.BytesIO(b)).convert("RGB"); im.thumbnail((1600,1600))
                          f=f"{out}/{clave}_{n}.jpg"; im.save(f,quality=88); n+=1
                          meta.append({"f":f,"titulo":p.get("title"),"licencia":lic,"autor":art,"fuente":ii.get("descriptionurl")})
                          print("ok",f,lic)
                      except Exception as e: print("skip",e)
                      if n>=5: break
                      time.sleep(1)
                  json.dump(meta,open(f"{out}/{clave}.json","w"),ensure_ascii=False,indent=1)
          PY
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add descargas
          git commit -m "Fotos libres" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push && exit 0; sleep 5; done; exit 1
